# On a version tag (e.g. v0.2.0), build static Linux binaries of both Rust
# tools for x86-64 and arm64 and attach them to a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Run the tests natively on each architecture before building.
      - run: cargo test --workspace --locked

      # Both tools are pure Rust, so the musl target gives fully static
      # binaries that run on any Linux distribution of that architecture.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          name="mikrotik-tzsp-tools-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir "$name"
          for bin in tzsp_ng_rotator tzsp_strip_rs; do
            path="target/${{ matrix.target }}/release/$bin"
            file "$path" | grep -q 'static' || { echo "$bin is not static" >&2; exit 1; }
            cp "$path" "$name/"
          done
          cp LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: mikrotik-tzsp-tools-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum mikrotik-tzsp-tools-*.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          mikrotik-tzsp-tools-*.tar.gz SHA256SUMS
