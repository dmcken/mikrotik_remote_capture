[project]
name = "tzsp-strip"
version = "0.1.0"
description = "Strip TZSP encapsulation from MikroTik sniffer capture files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.7.0",
]

[project.scripts]
tzsp-strip = "tzsp_strip.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
